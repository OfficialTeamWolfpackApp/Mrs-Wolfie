<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#05080c">
<title>Meet The Pack | Mrs Wolfie</title>
<style>
:root{--blue:#89dcff;--pink:#ff8fd3}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 0 15%,#07344b,transparent 40%),radial-gradient(circle at 100% 50%,#40102e,transparent 40%),#05080c;color:#fff;font:16px Arial,sans-serif;min-height:100vh}header{text-align:center;padding:28px 16px;border-bottom:1px solid #ffffff22}header small{color:var(--blue);letter-spacing:2px}header h1{margin:9px 0;color:var(--pink);font-size:clamp(24px,5vw,36px)}main{max-width:850px;margin:25px auto;padding:0 16px 55px}.back{display:inline-block;color:var(--blue);text-decoration:none;margin-bottom:20px}.back:hover{text-decoration:underline}.card{border:1px solid #ffffff2c;background:#071019e8;border-radius:17px;overflow:hidden;box-shadow:0 18px 48px #0008}.banner-area{position:relative;min-height:165px;background:linear-gradient(115deg,#07344b 0%,#102536 35%,#281327 70%,#4b1138 100%);overflow:hidden}.banner-area:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 15% 40%,#89dcff55,transparent 38%),radial-gradient(circle at 85% 55%,#ff8fd355,transparent 40%);pointer-events:none}.banner-area:after{content:"TEAM WOLFIE  •  ONE PACK ONE PURPOSE";position:absolute;inset:auto 15px 20px;text-align:center;font-size:clamp(11px,2.5vw,17px);font-weight:900;letter-spacing:2px;text-shadow:0 2px 12px #000;pointer-events:none}.banner-area.has-image:after{display:none}.banner{display:block;width:100%;max-height:320px;object-fit:contain;position:relative;z-index:1;background:#020407}.body{padding:24px 24px 32px;text-align:center}.portrait-frame{display:flex;justify-content:center;margin:-38px auto 20px;position:relative;z-index:2}.portrait{display:block;width:min(100%,290px);max-height:390px;object-fit:contain;object-position:center top;border-radius:12px;border:2px solid #89dcff77;background:#03070b;box-shadow:0 12px 28px #0009}.portrait-placeholder{display:flex;align-items:center;justify-content:center;width:180px;height:180px;border:2px solid #89dcff77;border-radius:12px;background:linear-gradient(135deg,#07344b,#40102e);font-size:60px}h2{font-size:clamp(23px,5vw,36px);margin:12px 0}#nickname,#role{text-align:center;color:var(--pink);font-weight:bold}#nickname{margin-top:10px;font-size:18px}#meta{text-align:center;color:var(--blue);font-size:13px;margin:14px 0 25px}#bio{line-height:1.8;white-space:pre-wrap;color:#d2dce5;text-align:left;max-width:690px;margin:24px auto 0}.note{color:#a8b2bf;text-align:center;padding:30px}.hidden{display:none!important}@media(max-width:520px){.body{padding:18px 16px 26px}.banner-area{min-height:135px}.portrait{width:min(100%,245px)}}
</style>
</head>
<body>
<header><small>TEAM WOLFIE • MEET THE PACK</small><h1>TEAM MEMBER PROFILE</h1></header>
<main><a class="back" href="./index.html#meet-the-pack">← BACK TO MEET THE PACK</a><div id="message" class="note">Loading profile…</div><article id="card" class="card hidden"><div id="bannerArea" class="banner-area"><img id="banner" class="banner hidden" alt="Team member banner"></div><div class="body"><div class="portrait-frame"><img id="photo" class="portrait hidden" alt="Team member photograph"><div id="photoPlaceholder" class="portrait-placeholder hidden" aria-label="No profile photograph">🐺</div></div><div id="role"></div><h2 id="name"></h2><div id="nickname"></div><div id="meta"></div><p id="bio"></p></div></article></main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js';
import {getDatabase,ref,get} from 'https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js';
const cfg={apiKey:'AIzaSyC06RDrqpXodbYBJqyeGvRkmtxQGapaaPY',authDomain:'team-wolfpack-app.firebaseapp.com',databaseURL:'https://team-wolfpack-app-default-rtdb.europe-west1.firebasedatabase.app',projectId:'team-wolfpack-app',storageBucket:'team-wolfpack-app.firebasestorage.app',messagingSenderId:'1070414578856',appId:'1:1070414578856:web:df14e7d387e658eeae2e9d'};
const id=new URLSearchParams(location.search).get('id')||'';
const fallback={
'mr-wolfie':{name:'Chris “Mr Wolfie” James',role:'Co-Founder • Manager',team:'Team Wolfie',photo:'https://raw.githubusercontent.com/OfficialTeamWolfpackApp/Team-Wolfpack-App/main/mr-wolfie.jpg',biography:'Co-Founder & Joint Owner of Team Wolfpack. Manager to Team Wolfie.'},
'greig-sloan':{name:'Greig Sloan',role:'Corner Team',team:'Team Wolfie',photo:'https://raw.githubusercontent.com/OfficialTeamWolfpackApp/Team-Wolfpack-App/main/greig-sloan.jpg'},
'bry-kelly':{name:'Bry Kelly',role:'Corner Team • Boxer',team:'Team Wolfie',photo:'https://raw.githubusercontent.com/OfficialTeamWolfpackApp/Team-Wolfpack-App/main/bry-kelly.jpg'},
'billy-burton':{name:'Billy “Bossman” Burton',role:'Corner Team • Boxer',team:'Team Wolfie',photo:'https://raw.githubusercontent.com/OfficialTeamWolfpackApp/Team-Wolfpack-App/main/billy-burton.jpg'},
'kelly-mcsporran':{name:'Kelly McSporran',nickname:'Bossgal',role:'Corner Team',team:'Team Wolfie',photo:'./images/Kelly.jpeg'},
'richard-davies':{name:'Richard Davies',role:'Sponsor',team:'Team Wolfie',photo:'https://raw.githubusercontent.com/OfficialTeamWolfpackApp/Team-Wolfpack-App/main/richard-davies.jpeg',biography:'Former Midlands Champion. CEO of King Clothing. Founder of The Kings Circle.'}
};
const $=id=>document.getElementById(id);
function url(v){if(typeof v!=='string'||!v.trim())return '';try{const u=new URL(v.trim(),location.href);return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}}
function showImage(key,value){const el=$(key),src=url(value);el.classList.add('hidden');el.removeAttribute('src');if(!src)return false;el.onerror=()=>{el.classList.add('hidden');el.removeAttribute('src');if(key==='banner')$('bannerArea').classList.remove('has-image');if(key==='photo')$('photoPlaceholder').classList.remove('hidden')};el.onload=()=>{el.classList.remove('hidden');if(key==='banner')$('bannerArea').classList.add('has-image');if(key==='photo')$('photoPlaceholder').classList.add('hidden')};el.src=src;return true}
function render(p){$('message').classList.add('hidden');$('card').classList.remove('hidden');$('name').textContent=p.name||'TEAM MEMBER';$('nickname').textContent=p.nickname?'“'+p.nickname+'”':'';$('role').textContent=p.role||'TEAM MEMBER';$('meta').textContent=[p.team,p.representing].filter(Boolean).join(' • ');$('bio').textContent=p.biography||'More profile information coming soon.';document.title=(p.name||'Team Member')+' | Mrs Wolfie';$('bannerArea').classList.remove('has-image');showImage('banner',p.banner);$('photoPlaceholder').classList.add('hidden');if(!showImage('photo',p.photo))$('photoPlaceholder').classList.remove('hidden')}
if(!/^[a-z0-9-]{1,80}$/.test(id)){$('message').textContent='Invalid profile link.'}else{
try{const snap=await get(ref(getDatabase(initializeApp(cfg,'mrsWolfieMemberPage')),'mrsWolfieTeamMembers/'+id));const p=snap.val();if(p&&p.visible===false){$('message').textContent='This profile is not currently available.'}else if(p)render(p);else if(fallback[id])render(fallback[id]);else $('message').textContent='Profile not found.'}catch(e){if(fallback[id])render(fallback[id]);else $('message').textContent='Unable to load this profile. Please try again later.';console.warn(e)}
}
</script></body></html>
