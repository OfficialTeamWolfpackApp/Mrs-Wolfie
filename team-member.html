<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05080c"><title>Meet The Pack | Mrs Wolfie</title><style>
:root{--blue:#89dcff;--pink:#ff8fd3}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 0 15%,#07344b,transparent 40%),radial-gradient(circle at 100% 50%,#40102e,transparent 40%),#05080c;color:white;font:16px Arial,sans-serif}header{text-align:center;padding:28px 16px;border-bottom:1px solid #ffffff22}header small{color:var(--blue);letter-spacing:2px}header h1{margin:9px 0;color:var(--pink)}main{max-width:850px;margin:25px auto;padding:0 16px 55px}.back{display:inline-block;color:var(--blue);text-decoration:none;margin-bottom:20px}.card{border:1px solid #ffffff2c;background:#071019e8;border-radius:17px;overflow:hidden}.banner{width:100%;max-height:320px;object-fit:contain;display:none;background:#020407}.body{padding:24px}.portrait{display:block;width:min(100%,280px);max-height:370px;object-fit:contain;object-position:center top;border-radius:12px;margin:0 auto 22px;border:1px solid #89dcff55}h2{text-align:center;font-size:clamp(22px,5vw,34px);margin:12px 0}#nickname,#role{text-align:center;color:var(--pink);font-weight:bold}#meta{text-align:center;color:var(--blue);font-size:12px;margin:14px 0 25px}#bio{line-height:1.8;white-space:pre-wrap;color:#d2dce5}.note{color:#a8b2bf;text-align:center;padding:30px}.hidden{display:none!important}</style></head><body><header><small>TEAM WOLFIE • MEET THE PACK</small><h1>TEAM MEMBER PROFILE</h1></header><main><a class="back" href="./index.html#meet-the-pack">← BACK TO MEET THE PACK</a><div id="message" class="note">Loading profile…</div><article id="card" class="card hidden"><img id="banner" class="banner" alt="Profile banner"><div class="body"><img id="photo" class="portrait hidden" alt="Profile photograph"><div id="role"></div><h2 id="name"></h2><div id="nickname"></div><div id="meta"></div><p id="bio"></p></div></article></main><script type="module">

const cfg={apiKey:'AIzaSyC06RDrqpXodbYBJqyeGvRkmtxQGapaaPY',authDomain:'team-wolfpack-app.firebaseapp.com',databaseURL:'https://team-wolfpack-app-default-rtdb.europe-west1.firebasedatabase.app',projectId:'team-wolfpack-app',storageBucket:'team-wolfpack-app.firebasestorage.app',messagingSenderId:'1070414578856',appId:'1:1070414578856:web:df14e7d387e658eeae2e9d'};
const id=new URLSearchParams(location.search).get('id')||'';
const fallback={
'mr-wolfie':{name:'Chris “Mr Wolfie” James',role:'Co-Founder • Manager',team:'Team Wolfie',photo:'https://raw.githubusercontent.com/OfficialTeamWolfpackApp/Team-Wolfpack-App/main/mr-wolfie.jpg',biography:'Co-Founder & Joint Owner of Team Wolfpack. Manager to Team Wolfie.'},
'greig-sloan':{name:'Greig Sloan',role:'Corner Team',team:'Team Wolfie',photo:'https://raw.githubusercontent.com/OfficialTeamWolfpackApp/Team-Wolfpack-App/main/greig-sloan.jpg'},

'billy-burton':{name:'Billy “Bossman” Burton',role:'Corner Team • Boxer',team:'Team Wolfie',photo:'https://raw.githubusercontent.com/OfficialTeamWolfpackApp/Team-Wolfpack-App/main/billy-burton.jpg'},
'kelly-mcsporran':{name:'Kelly McSporran',nickname:'Bossgal',role:'Corner Team',team:'Team Wolfie',photo:'./images/Kelly.jpeg'},
'richard-davies':{name:'Richard Davies',role:'Sponsor',team:'Team Wolfie',photo:'https://raw.githubusercontent.com/OfficialTeamWolfpackApp/Team-Wolfpack-App/main/richard-davies.jpeg',biography:'Former Midlands Champion. CEO of King Clothing. Founder of The Kings Circle.'}
};
const $=id=>document.getElementById(id);
function url(v){try{const u=new URL(v,location.href);return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}}
function render(p){$('message').classList.add('hidden');$('card').classList.remove('hidden');$('name').textContent=p.name||'TEAM MEMBER';$('nickname').textContent=p.nickname?'“'+p.nickname+'”':'';$('role').textContent=p.role||'TEAM MEMBER';$('meta').textContent=[p.team,p.representing].filter(Boolean).join(' • ');$('bio').textContent=p.biography||'More profile information coming soon.';document.title=(p.name||'Team Member')+' | Mrs Wolfie';for(const key of ['photo','banner']){const src=url(p[key]);if(src){$(key).src=src;$(key).classList.remove('hidden');if(key==='banner')$(key).style.display='block'}else $(key).classList.add('hidden')}}
if(!/^[a-z0-9-]{1,80}$/.test(id)){$('message').textContent='Invalid profile link.'}else{
try{const snap=await get(ref(getDatabase(initializeApp(cfg,'mrsWolfieMemberPage')),'mrsWolfieTeamMembers/'+id));const p=snap.val();if(p&&p.visible===false){$('message').textContent='This profile is not currently available.'}else if(p)render(p);else if(fallback[id])render(fallback[id]);else $('message').textContent='Profile not found.'}catch(e){if(fallback[id])render(fallback[id]);else $('message').textContent='Unable to load this profile. Please try again later.';console.warn(e)}
